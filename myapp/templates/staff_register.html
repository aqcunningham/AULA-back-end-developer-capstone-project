{% extends 'base.html' %}
{% block title %}Staff Registration{% endblock %}

{% block content %}
<div class="row justify-content-center">
  <div class="col-md-4">
    <h1 class="mb-4">Staff Registration</h1>

    <div id="error-message" class="alert alert-danger d-none"></div>

    <form id="register-form">
      {% csrf_token %}
      <div class="mb-3">
        <label class="form-label">Username</label>
        <input type="text" class="form-control" id="username" required>
      </div>
      <div class="mb-3">
        <label class="form-label">Email</label>
        <input type="email" class="form-control" id="email" required>
      </div>
      <div class="mb-4">
        <label class="form-label">Password</label>
        <input type="password" class="form-control" id="password" required>
      </div>
      <button type="submit" class="btn btn-primary">Register</button>
    </form>
  </div>
</div>
{% endblock %}

{% block scripts %}
<script>
document.getElementById('register-form').addEventListener('submit', function (e) {
  e.preventDefault()
  const data = {
    username: document.getElementById('username').value,
    email: document.getElementById('email').value,
    password: document.getElementById('password').value,
  }

  fetch("{% url 'staff_register_drf' %}", {
    method: 'POST',
    headers: {
      'Content-Type': 'application/json',
      'X-CSRFToken': document.cookie.split('csrftoken=')[1]?.split(';')[0]
    },
    body: JSON.stringify(data)
  })
    .then(r => r.json().then(body => ({ status: r.status, body })))
    .then(({ status, body }) => {
      if (status === 201) {
        window.location.href = "{% url 'staff_login' %}"
      } else {
        document.getElementById('error-message').textContent = JSON.stringify(body)
        document.getElementById('error-message').classList.remove('d-none')
      }
    })
})
</script>
{% endblock %}

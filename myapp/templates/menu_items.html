{% extends 'base.html' %}

{% block title %}Menu Items{% endblock %}
{% block content %}
<h1>Menu</h1>
<pre id="menu"></pre>
{% endblock %}


{% block scripts %}
<script>
	const menu = JSON.parse('{{ menu | escapejs }}');
	console.log(menu)
	const pretty_json = JSON.stringify(menu, null, 2);
  document.getElementById('menu').textContent = pretty_json;

</script>
{% endblock %}
